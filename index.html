  <style>
    /* ========== DESIGN TOKENS ========== */
    @import url('https://googleapis.com');

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255,255,255,0.04);
      --bg-glass: rgba(255,255,255,0.06);
      --border-glass: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #8b8b9e;
      --text-muted: #5a5a6e;
      --accent-1: #6c63ff;
      --accent-2: #00d4aa;
      --accent-3: #ff6b9d;
      --gradient-1: linear-gradient(135deg, #6c63ff 0%, #00d4aa 100%);
      --gradient-2: linear-gradient(135deg, #6c63ff 0%, #ff6b9d 100%);
      --gradient-3: linear-gradient(135deg, #00d4aa 0%, #6c63ff 50%, #ff6b9d 100%);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-lg: 0 16px 64px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 40px rgba(108,99,255,0.15);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-main: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* ========== RESET & BASE ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; font-size: 16px; }
    body {
      font-family: var(--font-main);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }

    /* ========== UTILITIES ========== */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .section { padding: 100px 0; position: relative; }
    .section-label {
      font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 3px;
      background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; display: inline-block;
    }
    .section-title { font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 800; margin-bottom: 16px; letter-spacing: -0.5px; }
    .section-desc { color: var(--text-secondary); font-size: 1.05rem; max-width: 600px; margin-bottom: 48px; }
    .section-header { margin-bottom: 60px; }

    /* ========== BACKGROUND FX ========== */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0; }
    .bg-orb-1 { width: 600px; height: 600px; background: var(--accent-1); top: -200px; right: -200px; }
    .bg-orb-2 { width: 500px; height: 500px; background: var(--accent-2); bottom: -150px; left: -150px; }
    .bg-orb-3 { width: 400px; height: 400px; background: var(--accent-3); top: 50%; left: 50%; transform: translate(-50%,-50%); }

    /* ========== NAVBAR FIXED HEADER ========== */
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 16px 0; transition: var(--transition); }
    .navbar.scrolled { background: rgba(10,10,15,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-glass); padding: 12px 0; }
    .navbar .container { display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -1px; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a { font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); transition: var(--transition); position: relative; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--gradient-1); transition: var(--transition); border-radius: 1px; }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
    .nav-cta { padding: 8px 20px !important; border-radius: var(--radius-sm); background: var(--gradient-1) !important; color: #fff !important; font-weight: 600 !important; }

    /* ========== HERO GRID MATRIX ========== */
    .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 80px; position: relative; z-index: 1; }
    .hero-content { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; width: 100%; }
    .hero-text-block { display: flex; flex-direction: column; align-items: flex-start; }
    @media (max-width: 968px) { .hero-text-block { align-items: center; } }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 50px; background: rgba(108,99,255,0.1); border: 1px solid rgba(108,99,255,0.2); font-size: 0.82rem; font-weight: 500; color: var(--accent-1); margin-bottom: 20px; }
    .hero-badge .dot { width: 6px; height: 6px; background: var(--accent-2); border-radius: 50%; }
    .hero-greeting { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 8px; }
    .hero-name { font-size: clamp(2.5rem, 5.5vw, 4rem); font-weight: 900; line-height: 1.1; letter-spacing: -2px; margin-bottom: 10px; }
    .hero-name .gradient-text { background: var(--gradient-3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-title { font-size: 1.3rem; color: var(--text-secondary); font-weight: 500; margin-bottom: 24px; }
    .hero-desc { font-size: 1rem; color: var(--text-muted); max-width: 480px; line-height: 1.8; margin-bottom: 36px; }
    .hero-buttons { display: flex; gap: 16px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: var(--transition); border: none; }
    .btn-primary { background: var(--gradient-1); color: #fff; box-shadow: 0 4px 20px rgba(108,99,255,0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,99,255,0.4); }
    .btn-secondary { background: var(--bg-glass); color: var(--text-primary); border: 1px solid var(--border-glass); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }

    .hero-visual { display: flex; justify-content: center; }
    .hero-avatar-wrapper { position: relative; }
    .hero-avatar-glow { position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%); z-index: 0; }
    .hero-stats { display: flex; gap: 40px; margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--border-glass); width: 100%; }
    .stat-number { font-size: 1.8rem; font-weight: 800; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    /* ========== ABOUT ARCHITECTURE ========== */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
    .about-text p { color: var(--text-secondary); margin-bottom: 20px; font-size: 1rem; }
    .about-highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
    .highlight-card { padding: 20px; border-radius: var(--radius-md); background: var(--bg-glass); border: 1px solid var(--border-glass); transition: var(--transition); }
    .highlight-card:hover { transform: translateY(-4px); border-color: rgba(108,99,255,0.2); box-shadow: var(--shadow-glow); }
    .highlight-icon { font-size: 1.6rem; margin-bottom: 10px; }
    .highlight-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .highlight-desc { font-size: 0.8rem; color: var(--text-muted); }

    /* ========== WORK TIMELINE ========== */
    .timeline { position: relative; padding-left: 40px; }
    .timeline::before { content: ''; position: absolute; left: 14px; top: 0; bottom: 0; width: 2px; background: linear-gradient(to bottom, var(--accent-1), var(--accent-2), transparent); }
    .timeline-item { position: relative; margin-bottom: 40px; }
    .timeline-dot { position: absolute; left: -40px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-1); border: 3px solid var(--bg-primary); }
    .timeline-content { padding: 24px; border-radius: var(--radius-md); background: var(--bg-glass); border: 1px solid var(--border-glass); transition: var(--transition); }
    .timeline-date { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent-2); font-weight: 500; margin-bottom: 4px; }
    .timeline-role { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
    .timeline-company { font-size: 0.9rem; color: var(--accent-1); margin-bottom: 4px; font-weight: 500; }
    .timeline-location { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }

.timeline-points li { position: relative; padding-left: 16px; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-secondary); }
.timeline-points li::before { content: '▹'; position: absolute; left: 0; color: var(--accent-1); }
/* ========== SHOWCASE TILES ========== */
.projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 28px; }
.project-card { border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-glass); border: 1px solid var(--border-glass); transition: var(--transition); position: relative; margin-bottom: 20px; }
.project-card:hover { transform: translateY(-8px); border-color: rgba(108,99,255,0.3); box-shadow: var(--shadow-glow); }
.project-image { position: relative; height: 220px; overflow: hidden; }
.project-image img { width: 100%; height: 100%; object-fit: cover; }
.project-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,15,0.9) 0%, transparent 60%); }
.project-tags { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.project-tag { padding: 4px 10px; border-radius: 50px; background: rgba(10,10,15,0.7); backdrop-filter: blur(10px); font-size: 0.7rem; font-weight: 500; color: var(--accent-2); border: 1px solid rgba(0,212,170,0.2); }
.project-info { padding: 24px; }
.project-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
.project-desc { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px; }
.project-links { display: flex; gap: 12px; }
.project-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 600; background: rgba(108,99,255,0.1); color: var(--accent-1); border: 1px solid rgba(108,99,255,0.2); }
/* ========== TECHNICAL BADGES ========== */
.skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
.skill-category { padding: 28px; border-radius: var(--radius-lg); background: var(--bg-glass); border: 1px solid var(--border-glass); }
.skill-cat-icon { font-size: 1.8rem; margin-bottom: 14px; }
.skill-cat-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
.skill-items { display: flex; flex-wrap: wrap; gap: 8px; }
.skill-pill { padding: 6px 14px; border-radius: 50px; background: rgba(108,99,255,0.08); border: 1px solid rgba(108,99,255,0.15); font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); }
/* ========== ACADEMIC CHECKPOINTS ========== */
.edu-grid { display: grid; gap: 20px; }
.edu-card { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; padding: 28px; border-radius: var(--radius-lg); background: var(--bg-glass); border: 1px solid var(--border-glass); transition: var(--transition); }
.edu-card:hover { border-color: rgba(108,99,255,0.2); transform: translateX(4px); }
.edu-icon { width: 50px; height: 50px; border-radius: var(--radius-md); background: rgba(108,99,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
.edu-degree { font-size: 1rem; font-weight: 700; }
.edu-school { font-size: 0.85rem; color: var(--text-secondary); }
.edu-year { font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono); }
.edu-score { padding: 8px 16px; border-radius: var(--radius-sm); background: rgba(0,212,170,0.1); border: 1px solid rgba(0,212,170,0.2); font-weight: 700; font-size: 0.9rem; color: var(--accent-2); }
.achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.achievement-card { padding: 24px; border-radius: var(--radius-md); background: var(--bg-glass); border: 1px solid var(--border-glass); transition: var(--transition); display: flex; align-items: flex-start; gap: 14px; }
.achievement-card:hover { border-color: rgba(108,99,255,0.2); transform: translateY(-4px); }
.achievement-icon { font-size: 1.5rem; flex-shrink: 0; }
.achievement-text { font-size: 0.9rem; color: var(--text-secondary); }
.achievement-text strong { color: var(--text-primary); }
/* ========== ENVELOPE INPUT COMPONENT ========== */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
.contact-info-text { color: var(--text-secondary); margin-bottom: 32px; }
.contact-links { display: flex; flex-direction: column; gap: 16px; }
.contact-link-item { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: var(--radius-md); background: var(--bg-glass); border: 1px solid var(--border-glass); transition: var(--transition); }
.contact-link-item:hover { border-color: rgba(108,99,255,0.2); transform: translateX(4px); }
.contact-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); background: rgba(108,99,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.contact-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; }
.contact-value { font-weight: 600; font-size: 0.95rem; }
.contact-form { padding: 36px; border-radius: var(--radius-lg); background: var(--bg-glass); border: 1px solid var(--border-glass); }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
.form-input, .form-textarea { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); color: var(--text-primary); font-size: 0.9rem; outline: none; }
.form-textarea { resize: vertical; min-height: 120px; }
.form-submit { width: 100%; justify-content: center; }
footer { padding: 40px 0; border-top: 1px solid var(--border-glass); margin-top: 4rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
.footer-content { display: flex; justify-content: space-between; align-items: center; }
/* ========== SYSTEM RESPONSIVENESS OVERRIDES ========== */
@media (max-width: 968px) {
.hero-content { grid-template-columns: 1fr; text-align: center; }
.hero-buttons { justify-content: center; }
.hero-visual { order: -1; }
.hero-stats { justify-content: center; }
.about-grid, .contact-grid, .projects-grid { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
.nav-links { display: none; }
.edu-card { grid-template-columns: 1fr; gap: 12px; }
}

const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
if (window.scrollY > 20) {
navbar.classList.add('scrolled');
} else {
navbar.classList.remove('scrolled');
}
});
const hamburger = document.getElementById('hamburger');
const navLinks = document.getElementById('nav-links');
hamburger.addEventListener('click', () => {
hamburger.classList.toggle('active');
navLinks.classList.toggle('open');
});
const revealElements = document.querySelectorAll('.reveal');
const revealOnScroll = () => {
revealElements.forEach(el => {
const windowHeight = window.innerHeight;
const elementTop = el.getBoundingClientRect().top;
const elementVisible = 120;
if (elementTop < windowHeight - elementVisible) {
el.classList.add('active');
}
});
};
window.addEventListener('scroll', revealOnScroll);
revealOnScroll();
